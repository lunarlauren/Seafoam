<!doctype html>
<!-- Cloudflare Pages: this build is static; publish the repository root without a build command. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#15142d">
  <meta name="description" content="Watch Seafoam, an independent animated sci-fantasy series by Lauren Leven.">
  <title>Seafoam — an animated series</title>
  <style>
    /* COLOR GUIDE: edit these values to change the site's main palette. */
    :root {
      color-scheme: dark;
      --night: #10143a;
      --deep: #172151;
      --panel: rgba(37, 43, 94, .88);
      --line: rgba(120, 226, 255, .32);
      --text: #fffaff;
      --muted: #d8d8f4;
      --aqua: #89fff2;
      --pink: #ffb0ee;
      --violet: #c6a5ff;
      --gold: #fff0ad;
      --glass-specular: rgba(202, 236, 255, .98);
      --glass-rim: rgba(75, 157, 247, .62);
      --glass-tint: rgba(56, 143, 229, .32);
      --glass-shadow: rgba(39, 127, 218, .14);
      --serif: Georgia, "Times New Roman", serif;
      --sans: "Trebuchet MS", Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      position: relative;
      isolation: isolate;
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      color: var(--text);
      background-color: #10143a;
      font: 14px/1.45 var(--sans);
    }

    /* The embedded ambient video sits behind a dark wash for readable glass panels. */
    .ambient-video {
      position:fixed;
      z-index:-1;
      inset:0;
      width:100%;
      height:100%;
      overflow:hidden;
      pointer-events:none;
      background:#07142c;
    }
    .ambient-video iframe {
      position:absolute;
      top:50%;
      left:50%;
      width:max(100vw,177.78vh);
      height:max(100vh,56.25vw);
      border:0;
      transform:translate(-50%,-50%) scale(1.16);
      opacity:.88;
      filter:brightness(.94) saturate(1.12);
    }
    .ambient-video::after {
      position:absolute;
      inset:0;
      content:"";
      background:#07142c;
      animation:ambient-reveal .8s ease 2.2s forwards;
    }
    @keyframes ambient-reveal { to { opacity:0; visibility:hidden; } }
    body { background:#07142c; }
    button, a { color: inherit; font: inherit; }
    button { cursor: pointer; }
    a { text-decoration: none; }
    :focus-visible { outline: 2px solid var(--aqua); outline-offset: 2px; }
    [hidden] { display: none !important; }

    /* The shell keeps the desktop player and both sidebars in one stable frame. */
    .shell { min-height: 100svh; position: relative; isolation: isolate; }
    .shell::before {
      position: fixed;
      z-index: -1;
      inset: 0;
      content: "";
      pointer-events: none;
      opacity: .3;
      background:
        radial-gradient(circle at 8% 29%, #76e9e4b8 0 1px, #8ef8ff77 2px, transparent 6px),
        radial-gradient(circle at 89% 17%, #70e9e4d9 0 1px, #83fff288 2px, transparent 7px),
        radial-gradient(circle at 74% 83%, #ffe1ffb8 0 1px, #d29cff88 2px, transparent 7px),
        radial-gradient(circle at 20% 78%, #70e9e4a8 0 1px, #8ef8ff77 2px, transparent 6px),
        radial-gradient(circle at 50% 8%, #70e9e4bb 0 1px, #a6b9ff77 2px, transparent 6px);
      animation: bubble-drift 9s ease-in-out infinite alternate;
    }
    .topbar {
      position: relative;
      z-index: 2;
      height: 62px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: min(1480px, 100%);
      margin: 0 auto;
      padding: 0 22px;
      border-bottom: 1px solid #bffaff55;
      background: linear-gradient(180deg, #70e9e412, transparent);
      box-shadow: 0 1px #70e9e412;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border: 0;
      padding: 0;
      background: transparent;
      font: 1.16rem var(--serif);
      letter-spacing: .16em;
    }
    .brand-orb {
      position: relative;
      overflow: hidden;
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border: 1px solid #d6ffff;
      border-radius: 50%;
      color: var(--aqua);
      background:
        radial-gradient(circle at 32% 23%, #70e9e4d9 0 5%, #a8fff2b8 11%, transparent 37%),
        radial-gradient(circle at 65% 72%, #b575ff99, transparent 58%),
        linear-gradient(145deg, #77f8ee77, #5c5fd077 56%, #25245d);
      box-shadow: inset 0 2px 5px #70e9e4c2, inset 0 -5px 9px #191a60a8, 0 2px 8px #8ef8ff38;
      animation: float 4s ease-in-out infinite;
    }
    .brand-orb svg { width: 20px; }
    .top-actions { display: flex; align-items: center; gap: 12px; }
    .status {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: .63rem;
      letter-spacing: .13em;
      text-transform: uppercase;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--aqua);
      box-shadow: 0 0 4px var(--aqua);
      animation: pulse 2s ease-in-out infinite;
    }
    .sound-toggle {
      --button-tint: var(--aqua);
      border-radius: 4px;
      padding: 7px 12px;
      color: var(--text);
      font-size: .62rem;
    }
    .sound-toggle[aria-pressed="true"] { color: var(--aqua); border-color: #9af7e877; }

    .layout {
      width: min(1480px, 100%);
      min-height: calc(100svh - 62px);
      margin: 0 auto;
      padding: clamp(28px, 8svh, 72px) 20px 24px;
      display: grid;
      grid-template-columns: 205px minmax(0, 1fr) 190px;
      align-items: stretch;
      align-content: start;
      gap: 18px;
    }
    .rail { min-width: 0; display: flex; flex-direction: column; gap: 12px; }
    .nav-rail { align-self:stretch; padding-top:0; }
    .nav-rail { align-self: stretch; padding-top: 0; }
    .left-rail { display:grid; height:100%; min-height:0; grid-template-rows:minmax(0,1fr) auto auto; }
    .glass {
      border: 1px solid rgba(147, 200, 255, .54);
      border-radius: 4px;
      background:
        linear-gradient(180deg, rgba(190, 230, 255, .13), transparent 19%),
        radial-gradient(ellipse at 15% 0%, rgba(58, 160, 230, .18), transparent 48%),
        linear-gradient(145deg, rgba(16, 45, 91, .72), rgba(10, 28, 68, .78) 58%, rgba(15, 47, 86, .72));
      box-shadow: inset 0 1px 0 rgba(226, 246, 255, .55), inset 0 -12px 24px rgba(3, 13, 39, .34), 0 10px 26px rgba(2, 10, 29, .3);
      -webkit-backdrop-filter: blur(10px) saturate(145%);
      backdrop-filter: blur(10px) saturate(145%);
    }
    .series-card {
      min-height: 164px;
      display: grid;
      align-self:stretch;
      place-items: center;
      padding: 14px;
      border-radius: 4px;
      text-align: center;
      background:
        radial-gradient(circle at 50% 38%, rgba(92,151,255,.28) 0 2%, transparent 34%),
        radial-gradient(ellipse at 20% 0%, rgba(78,193,239,.26), transparent 42%),
        linear-gradient(145deg, rgba(17,69,119,.42), rgba(28,42,101,.52) 52%, rgba(8,25,61,.62));
      box-shadow: inset 0 2px 0 rgba(255,255,255,.46), inset 0 -8px 16px #15134488, 0 8px 18px #080b3155;
    }
    .series-card button { width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; border:0; padding:14px 8px; background:none; cursor:pointer; transition:transform .3s ease, filter .3s ease; }
    .series-card button:hover { transform:translateY(-2px); filter:brightness(1.08); }
    .series-card:has(button:hover) { box-shadow:0 14px 32px rgba(29,111,205,.22) !important; }
    .large-orb {
      width: 88px;
      height: 88px;
      display: grid;
      place-items: center;
      margin: auto;
      border: 1px solid #e2ffff;
      border-radius: 50%;
      color: var(--aqua);
      background:
        radial-gradient(circle at 30% 24%, #70e9e4eb 0 4%, #c8fff5a8 9%, transparent 34%),
        radial-gradient(circle at 70% 76%, #e099ff88, transparent 57%),
        linear-gradient(145deg, #5cfff0aa, #8074e8aa 62%, #20214e);
      box-shadow: inset 0 3px 8px #70e9e4d9, inset 0 -7px 12px #19174f9c, 0 2px 8px #19174f70;
      animation: float 5s ease-in-out infinite;
    }
    .large-orb svg { width: 48px; filter: drop-shadow(0 0 8px var(--aqua)); }
    .series-summary { max-width:24ch; margin:8px 0 0; color:rgba(227,239,255,.82); font-size:.7rem; line-height:1.55; }
    .series-name { display: block; margin-top: 8px; font: 1.1rem var(--serif); letter-spacing: .16em; }
    .series-caption { display: block; margin-top: 2px; color: var(--muted); font-size: .6rem; letter-spacing: .12em; text-transform: uppercase; }
    .section-label {
      margin: 0 0 9px;
      color: var(--aqua);
      font-size: .62rem;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .cast-card { width: 100%; padding: 12px; color: var(--text); text-align: left; cursor: pointer; transition: transform .18s ease, border-color .18s ease, filter .18s ease; }
    .cast-card:hover { transform: translateY(-2px); border-color: #ff9fcf9c; filter: brightness(1.12); }
    .cast-icons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .cast-icon {
      position:relative;
      overflow:hidden;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border: 1px solid #7ce9e6d9;
      border-radius: 4px;
      color: #211d43;
      background: linear-gradient(145deg, #70e9e4a8, transparent 34%), var(--icon-color);
      font: 1rem var(--serif);
      box-shadow: inset 0 2px 3px #70e9e4d9, inset 0 -4px 6px #211d4359, 0 3px 7px #080b2b4a;
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .cast-icon img { position:absolute; width:300%; height:300%; max-width:none; left:-100%; top:-26%; object-fit:contain; border-radius:inherit; }
    .cast-hint { margin: 8px 0 0; color: var(--muted); font-size: .64rem; }
    /* Square festival artwork keeps the award visible in the compact side rail. */
    .laurel {
      width: 100%;
      aspect-ratio: 1;
      min-height: 0;
      margin: 0;
      overflow: hidden;
      padding: 4px;
      border-color: rgba(91,157,220,.18);
      border-radius: 4px;
      background: rgba(17,43,77,.3);
      box-shadow: 0 12px 30px rgba(1,9,25,.28);
    }
    .laurel img {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 4px;
      object-fit: cover;
      filter:brightness(.48) saturate(.62) contrast(1.16);
      mix-blend-mode:screen;
    }
    .poster-button { display:block; width:100%; height:100%; padding:0; border:0; background:none; cursor:zoom-in; }
    .poster-button:focus-visible { outline:2px solid #65c9ff; outline-offset:3px; border-radius:4px; }
    .poster-button img { transition:transform .38s cubic-bezier(.2,.7,.2,1), filter .38s ease; }
    .poster-button:hover img { transform:scale(1.035); filter:brightness(.66) saturate(.82) contrast(1.12); }
    .poster-button:hover { box-shadow:inset 0 0 24px rgba(65,166,255,.35); }

    .stage { min-width: 0; display: flex; flex-direction: column; gap: 12px; }
    .player {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      max-height: 64svh;
      overflow: hidden;
      border: 3px solid #d7ffff;
      border-radius: 4px;
      background:
        radial-gradient(ellipse at 50% 45%, #8775ff70 0 2%, transparent 24%),
        radial-gradient(ellipse at 72% 84%, #45caba66 0 2%, transparent 28%),
        linear-gradient(145deg, #283b59, #15162e 72%);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.92),
        0 0 0 2px #ba9fff82,
        0 10px 28px #09081799;
    }
    .player::before {
      position: absolute;
      z-index: 1;
      inset: 0;
      content: "";
      pointer-events: none;
      background:
        radial-gradient(circle at 16% 22%, #78fff099 0 1px, transparent 3px),
        radial-gradient(circle at 82% 24%, #9b8affcc 0 1px, transparent 3px),
        radial-gradient(circle at 78% 72%, var(--pink) 0 2px, transparent 4px),
        radial-gradient(circle at 18% 78%, var(--aqua) 0 2px, transparent 4px);
    }
    .player iframe { position: absolute; z-index: 0; inset: 0; width: 100%; height: 100%; border: 0; }
    .player-label {
      position: absolute;
      z-index: 2;
      top: 14px;
      left: 14px;
      padding: 6px 11px;
      border: 1px solid #82e9e6;
      border-radius: 4px;
      color: #fffaff;
      background: linear-gradient(145deg, #70e9e438, #202456dc);
      box-shadow: inset 0 1px 2px #70e9e4b8, 0 3px 8px #05092588;
      font-size: .59rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      backdrop-filter: blur(8px);
      pointer-events: none;
    }
    .player-message {
      position: absolute;
      z-index: 2;
      right: 12px;
      bottom: 12px;
      left: 12px;
      width: fit-content;
      max-width: calc(100% - 24px);
      margin: 0 auto;
      padding: 8px 13px;
      border: 1px solid #f5e9ff;
      border-radius: 4px;
      color: #fffaff;
      background: linear-gradient(145deg, #70e9e438, #211d69e8);
      box-shadow: inset 0 1px 2px #70e9e4a8, 0 3px 8px #05092588;
      font-size: .65rem;
      text-align: center;
      backdrop-filter: blur(9px);
      pointer-events: none;
    }
    .episode-info {
      min-height: 86px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 14px 17px;
      border: 1px solid #dffeffbb;
      border-radius: 4px;
      background:
        radial-gradient(ellipse at 6% 0%, #70e9e448 0 2%, transparent 22%),
        radial-gradient(ellipse at 100% 90%, #41e6dc55 0 2%, transparent 26%),
        linear-gradient(115deg, #4e467e, #292b65 58%, #235b79);
      box-shadow: inset 0 2px 0 rgba(255,255,255,.55), inset 0 -6px 12px #14143e80, 0 8px 18px #070b3155;
    }
    .episode-info-copy { min-width: 0; }
    .eyebrow { margin: 0 0 4px; color: var(--aqua); font-size: .6rem; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; }
    .episode-info h1 { margin: 0; font: clamp(1.2rem, 2.3vw, 1.8rem)/1.08 var(--serif); }
    .episode-info p:last-child { margin: 5px 0 0; color: var(--muted); font-size: .72rem; }
    .watch-button {
      --button-tint: var(--violet);
      flex: 0 0 auto;
      padding: 10px 16px;
      border-radius: 4px;
      color: white;
      font-size: .62rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .watch-button:hover { filter: brightness(1.05); transform: translateY(0); }

    .nav-rail { display: flex; flex-direction: column; gap: 9px; align-self: stretch; padding-top: 4px; }
    .nav-button {
      --button-tint: var(--accent, var(--aqua));
      min-height: 60px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-radius: 4px;
      padding: 8px 11px;
      color: var(--text);
      text-align: left;
    }
    .nav-button:hover { transform: translateX(-1px); border-color: #9af7e899; filter: brightness(1.04); }
    .nav-button[aria-pressed="true"] { border-color: #9af7e899; box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 3px 8px rgba(5,14,45,.28); }
    .nav-icon {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border: 1px solid color-mix(in srgb, var(--accent) 78%, white);
      border-radius: 4px;
      color: var(--accent);
      background:
        radial-gradient(ellipse at 30% 12%, #70e9e4ba 0 2%, transparent 22%),
        color-mix(in srgb, var(--accent) 36%, #29275c);
      box-shadow: inset 0 2px 3px #70e9e4b8, inset 0 -3px 5px #1516418c, 0 2px 6px color-mix(in srgb, var(--accent) 26%, transparent);
    }
    .nav-icon svg { width: 19px; }
    .nav-button strong { display: block; font: 1rem var(--serif); }
    .nav-button small { display: block; margin-top: 2px; color: var(--muted); font-size: .59rem; }
    .nav-button:nth-child(1) { --accent: var(--aqua); }
    .nav-button:nth-child(2) { --accent: var(--pink); }
    .nav-button:nth-child(3) { --accent: var(--violet); }
    .nav-button:nth-child(4) { --accent: var(--gold); }

    /* One movable information window stays above the playing video. */
    .modal {
      position: fixed;
      z-index: 20;
      top: 50%;
      left: 50%;
      width: min(560px, calc(100vw - 28px));
      max-height: min(86svh, 820px);
      min-width:280px;
      min-height:220px;
      max-width: min(92vw, 1100px);
      display: flex;
      flex-direction: column;
      overflow: auto;
      resize: both;
      border: 1.5px solid #69e8e699;
      border-radius: 4px;
      background:
        radial-gradient(ellipse at 12% 0%, #55dbea40 0 2%, transparent 22%),
        radial-gradient(ellipse at 95% 100%, #b958ff42 0 2%, transparent 28%),
        linear-gradient(145deg, rgba(57, 56, 126, .94), rgba(24, 31, 83, .96));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.46), 0 18px 56px #080715c7;
      transform: translate(-50%, -50%);
      -webkit-backdrop-filter: blur(28px) saturate(165%);
      backdrop-filter: blur(28px) saturate(165%);
    }
    .modal[hidden] { display: none; }
    .modal:not([hidden]) { animation: window-in .16s ease-out; }
    .modal-header {
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 12px 8px 17px;
      border-bottom: 1px solid #62dfe26e;
      background: radial-gradient(ellipse at 16% 0%, #55dfe932, transparent 58%), linear-gradient(100deg, #675a9a, #3e4e91 62%, #416f91);
      box-shadow: inset 0 2px 0 #53dfe744, 0 2px 10px #090c3855;
      cursor: grab;
      touch-action: none;
      user-select: none;
    }
    .modal-header:active { cursor: grabbing; }
    .modal-heading { display: flex; align-items: center; gap: 9px; font: 1rem var(--serif); }
    .drag-mark { color: var(--aqua); font: 1rem var(--sans); letter-spacing: -.1em; }
    .modal-close {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border: 1px solid #82e9e6ca;
      border-radius: 50%;
      color: var(--text);
      background: linear-gradient(145deg, #70e9e455, #25275f);
      box-shadow: inset 0 1px 2px #70e9e4b8, 0 3px 8px #080b3155;
      font-size: 1rem;
    }
    .modal-body { overflow:auto; padding:16px; overscroll-behavior:contain; scrollbar-width:thin; scrollbar-color:#56b8f2 rgba(9,28,61,.42); }
    .modal-body::-webkit-scrollbar { width:9px; }
    .modal-body::-webkit-scrollbar-track { margin:8px 2px; border:1px solid rgba(91,157,220,.16); border-radius:99px; background:rgba(5,20,48,.42); }
    .modal-body::-webkit-scrollbar-thumb { border:2px solid rgba(8,27,58,.78); border-radius:99px; background:linear-gradient(180deg,#78e8ed,#4c9ded 55%,#8769d8); box-shadow:0 0 9px rgba(65,166,255,.24); }
    .poster-view { display:block; width:100%; height:auto; max-height:calc(100svh - 170px); object-fit:contain; margin:auto; border-radius: 4px; }
    .modal:has(.poster-view) { width:min(820px,calc(100vw - 28px)); }
    .modal-title { margin: 0; font: 1.55rem/1.1 var(--serif); }
    .modal-lede { margin: 6px 0 14px; color: var(--muted); font-size: .76rem; }
    .modal-note { margin: 12px 0 0; color: var(--muted); font-size: .68rem; }

    .episode-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .episode-card {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid #72e9e58c;
      border-radius: 4px;
      padding: 9px;
      background:
        radial-gradient(ellipse at 20% 0%, #70e9e438 0 2%, transparent 23%),
        linear-gradient(135deg, #5b568c, #34376f 65%, #335c7a);
      box-shadow: inset 0 1px 0 #70e9e46e, inset 0 -4px 8px #17183e69, 0 4px 10px #070b3155;
      text-align: left;
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .episode-card:hover, .episode-card[aria-current="true"] { border-color: #9af7e8a6; background: linear-gradient(135deg, #474168, #273449); }
    .episode-number {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border: 1px solid #82e9e6;
      border-radius: 50%;
      color: #fffaff;
      background:
        radial-gradient(circle at 30% 22%, #70e9e4ed 0 4%, #b7fff090 18%, transparent 42%),
        linear-gradient(145deg, #6deee4, #9280f5 64%, #f59ee0);
      box-shadow: inset 0 2px 4px #70e9e4d9, inset 0 -4px 7px #28215d85, 0 2px 6px #080b3155;
      font: .85rem var(--serif);
    }
    .episode-card strong { display: block; font: .88rem var(--serif); }
    .episode-card small { display: block; margin-top: 3px; color: var(--muted); font-size: .59rem; }

    .character-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
    .character-card {
      display: grid;
      grid-template-columns: 64px minmax(0, 1fr);
      align-items: center;
      gap: 10px;
      border: 1px solid #e5fbff99;
      border-radius: 4px;
      padding: 9px;
      background:

    /* Reusable glossy button finish: one sharp catch-light and a compact colored shadow. */
    .gloss-button {
      --button-tint: var(--glass-tint);
      position: relative;
      isolation: isolate;
      overflow: hidden;
      border: 1px solid var(--glass-rim);
      background:
        linear-gradient(180deg, rgba(238,250,255,.98) 0 1px, rgba(172,220,255,.58) 2px, transparent 7px),
        radial-gradient(ellipse 90% 70% at 50% -4%, rgba(138,205,255,.25), transparent 64%),
        linear-gradient(180deg, rgba(77,145,201,.2), rgba(17,51,99,.31) 42%, rgba(5,24,58,.55));

        inset 0 1px 0 rgba(245,252,255,.98),
        inset 0 0 0 1px rgba(162,215,255,.24),
        inset 0 -1px 0 rgba(4,18,49,.7),
        0 3px 9px rgba(2,12,34,.34);
      -webkit-backdrop-filter: blur(5px) saturate(135%);
      backdrop-filter: blur(5px) saturate(135%);
      transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
    }
    .gloss-button::before {
      position: absolute;
      z-index: 1;
      top: 1px;
      right: 9%;
      left: 9%;
      height: 2px;
      border-radius: 4px;
      background: linear-gradient(90deg, transparent, rgba(206,236,255,.82) 14%, #fff 38% 62%, rgba(128,194,255,.9) 86%, transparent);
      content: "";
      pointer-events: none;
    }

    /* Hover behavior: a narrow reflection sweeps across the glass without a large glow. */
    .gloss-button::after {
      position: absolute;
      z-index: 0;
      inset: 1px;
      border-radius: inherit;
      background: radial-gradient(ellipse 34% 145% at 50% 0%, rgba(242,250,255,.66) 0 2%, rgba(193,228,255,.2) 20%, rgba(95,170,255,.12) 38%, transparent 68%);
      content: "";
      opacity: 0;
      pointer-events: none;
      transform: translateX(-28%);
      transition: opacity .4s ease, transform 1.35s cubic-bezier(.2,.75,.25,1);
    }
    @media (hover: hover) and (pointer: fine) {
      .gloss-button:hover {
        border-color: rgba(210,238,255,.98);
        filter: saturate(1.22) brightness(1.08);
        box-shadow:
          inset 0 1px 0 rgba(255,255,255,1),
          inset 0 0 0 1px rgba(190,226,255,.42),
          inset 0 -1px 0 rgba(3,17,45,.7),
          0 0 0 1px rgba(100,181,255,.34),
          0 4px 12px rgba(2,12,35,.42);
      }
      .gloss-button:hover::after {
        opacity: .62;
        transform: translateX(28%);
      }
    }

      transform: translateY(1px);
      filter: brightness(.98);
      transition-duration: .08s;
    }

      <div class="modal-body" id="modalBody"></div>
    </section>

    <footer class="footer">Created by Lauren Leven · SEAFOAM · An independent animated sci-fantasy series · <span id="year"></span></footer>
  </div>

  <script>
    /* Gentle scroll parallax: move the star layer, never track the pointer. */
    let parallaxFrame = 0;
    function updateBackgroundParallax() {
      if (parallaxFrame || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      parallaxFrame = window.requestAnimationFrame(() => {
        const offset = Math.min(window.scrollY * 0.06, 30);
        document.documentElement.style.setProperty("--parallax-y", offset + "px");
        parallaxFrame = 0;
      });
    }
    window.addEventListener("scroll", updateBackgroundParallax, { passive: true });
    updateBackgroundParallax();

    /* EPISODE EDITING:
       Add each YouTube video ID in videoId. The ID is the part after "v=" in its URL.
       Titles and summaries can be changed here. Blank IDs are listed but do not replace the playing video.
       Episodes 1–4 and 6 are editable slots until their final titles and links are added.
    */
    const episodes = [
      { number: "01", title: "Begin Again", description: "Alex begins a new life on a strange planet and meets Yunoire.", videoId: "PmpK3zloNQU" },
      { number: "02", title: "The Dark Side of the Moon", description: "Alex discovers that life on her new world has a darker side.", videoId: "bEexbCSNDW0" },
      { number: "03", title: "World Away", description: "Alex and Yunoire learn more about each other and their world.", videoId: "woa_XZvQyeE" },
      { number: "04", title: "Trouble", description: "The crew faces new conflict as the expedition continues.", videoId: "fMMxjRrJCSQ" },
      { number: "05", title: "The Moon: Reversed", description: "Alex questions her alliances while answers may be buried in her unconscious.", videoId: "-9wHI0Xynkg" },
      { number: "06", title: "Space Invader", description: "An unexpected presence disrupts life aboard the ship.", videoId: "NDYAiRJdT38" },
      { number: "07", title: "Pouring Rain", description: "Unlikely alliances form.", videoId: "ho-a8dA5n1I" },
      { number: "08", title: "Crashing Waves", description: "The expedition is pushed into dangerous waters.", videoId: "Kn8JkIpY-l4" },
      { number: "09", title: "Game Over", description: "The crew reaches a turning point with everything at stake.", videoId: "0jO58onY4Sk" }
    ];

    /* CHARACTER EDITING:
       Change name, bio, initials, color, or image for each character.
       Each image points to the matching character PNG in the repository.
    */
    const characters = [
      { name: "Alex", initials: "A", color: "linear-gradient(145deg,#88efd9,#7478cf)", image: "./Alex-Character.png", bio: "The story's central character. Her search for the truth brings her into the orbit of F.A.T.E. Labs." },
      { name: "Yunoire", initials: "Y", color: "linear-gradient(145deg,#8aabff,#b66fe5)", image: "./YunoirePNG.png", bio: "A Kir whose connection with Alex changes the course of the story." },
      { name: "Jack", initials: "J", color: "linear-gradient(145deg,#c9a5ff,#6359a9)", image: "./Jack Transparent.png", bio: "A member of Alex's circle whose loyalty is tested as the crew faces danger." },
      { name: "Charlotte", initials: "C", color: "linear-gradient(145deg,#ff9fcf,#bd577f)", image: "./Charlotte Transparent.png", bio: "A sharp, decisive member of the crew with a pivotal role in the story." },
      { name: "Apollo", initials: "A", color: "linear-gradient(145deg,#7fe0f1,#4d739e)", image: "./apollo transparent.png", bio: "A compelling figure whose influence over the crew has a darker side." },

    ];

    const modal = document.querySelector("#infoModal");
    const modalBody = document.querySelector("#modalBody");
    const modalHeading = document.querySelector("#modalHeading");
    const videoFrame = document.querySelector("#videoFrame");
    const playerLabel = document.querySelector("#playerLabel");
    const playerMessage = document.querySelector("#playerMessage");
    const panelButtons = Array.from(document.querySelectorAll("[data-panel]"));
    let activeEpisode = "05";
    let soundEnabled = false;
    let audioContext;

    /* Short optional chime. Sound is off until the visitor switches it on. */
    function playChime() {
      if (!soundEnabled) return;
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return;
      if (!audioContext) audioContext = new AudioContextClass();
      const oscillator = audioContext.createOscillator();
      const volume = audioContext.createGain();
      oscillator.type = "sine";
      oscillator.frequency.value = 520;
      volume.gain.setValueAtTime(.035, audioContext.currentTime);
      volume.gain.exponentialRampToValueAtTime(.001, audioContext.currentTime + .12);
      oscillator.connect(volume);
      volume.connect(audioContext.destination);
      oscillator.start();
      oscillator.stop(audioContext.currentTime + .12);
    }

    function portraitMarkup(character) {
      const picture = character.image
        ? '<img src="' + character.image + '" alt="' + character.name + '">'
        : character.initials;
      return '<span class="portrait" style="--portrait-bg:' + character.color + '">' + picture + '</span>';
    }

    function setPanelButtonState(name) {
      panelButtons.forEach(function (button) {
        button.setAttribute("aria-pressed", String(button.dataset.panel === name));
      });
    }

    function openPanel(name) {
      modal.hidden = false;
      modal.style.left = ""; modal.style.top = ""; modal.style.bottom = ""; modal.style.transform = "";
      setPanelButtonState(name);
      modalBody.scrollTop = 0;
      renderPanel(name);
      playChime();
    }

    function openPoster() {
      modal.hidden = false;
      modal.style.left = ""; modal.style.top = ""; modal.style.bottom = ""; modal.style.transform = "";
      setPanelButtonState("");
      modalHeading.textContent = "Seafoam · Best Poster";
      modalBody.innerHTML = '<img class="poster-view" src="./best%20poster%20square%20%281%29.png" alt="Seafoam Best Poster award artwork">';
      modalBody.scrollTop = 0;
    }

    function closePanel() {
      modal.hidden = true;
      setPanelButtonState("");
    }

    function panelMessage(name) {
      const messages = {
        episodes: "Pick a chapter to watch",
        characters: "Meet the Seafoam crew",
        social: "A little art from the series",
        contact: "Stay in the loop",
        about: "A story beneath the surface"
      };
      return messages[name] || "Your tiny guide to the series";
    }

    function renderPanel(name) {
      const headings = {
        episodes: "Episode archive",
        characters: "Meet the characters",
        social: "Seafoam on Instagram",
        contact: "Follow the series",
        about: "About Seafoam"
      };
      modalHeading.textContent = headings[name] || "Seafoam information";

      if (name === "episodes") {
        modalBody.innerHTML =
          '<h2 class="modal-title">Season one · 9 episodes</h2>' +
          '<p class="modal-lede">Choose an episode to load it in the player. Unlinked episodes stay listed and will not interrupt the video.</p>' +
          '<div class="episode-list">' +
          episodes.map(function (episode) {
            const linked = Boolean(episode.videoId);
            const state = linked ? "Play episode" : "Video link to be added";
            return '<button class="episode-card gloss-button" type="button" data-episode="' + episode.number + '" aria-current="' + String(episode.number === activeEpisode) + '">' +
              '<span class="episode-number">' + episode.number + '</span>' +
              '<span><strong>' + episode.title + '</strong><small>' + state + '</small></span>' +
              '</button>';
          }).join("") +
          '</div><p class="modal-note">Episode titles and links are editable in the episodes list near the top of the script.</p>';
        modalBody.querySelectorAll("[data-episode]").forEach(function (button) {
          button.addEventListener("click", function () { chooseEpisode(button.dataset.episode); });
        });
      }

      if (name === "characters") {
        modalBody.innerHTML =
          '<h2 class="modal-title">Characters</h2>' +
          '<p class="modal-lede">Tap a profile to open its description. Meet the five characters at the heart of the series.</p>' +
          '<div class="character-grid">' +
          characters.map(function (character, index) {
            return '<button class="character-card gloss-button" type="button" data-character="' + index + '">' +
              portraitMarkup(character) +
              '<span><strong>' + character.name + '</strong><small>Open character profile ↗</small></span>' +
              '</button>';
          }).join("") +
          '</div>';
        modalBody.querySelectorAll("[data-character]").forEach(function (button) {
          button.addEventListener("click", function () { renderCharacter(Number(button.dataset.character)); });
        });
      }

      if (name === "social") {
        modalBody.innerHTML =
          '<h2 class="modal-title">Seafoam social feed</h2>' +
          '<p class="modal-lede">A little window into the art and making of the series.</p>' +
          '<div class="gallery-grid"><div class="gallery-tile"><span>Seafoam art</span></div><div class="gallery-tile"><span>Character art</span></div><div class="gallery-tile"><span>Behind the scenes</span></div></div>' +
          '<p class="modal-note">These are visual placeholders. Add selected post images here when you are ready. <a class="social-link" href="https://www.instagram.com/aphrosanimation/" target="_blank" rel="noopener">Visit @aphrosanimation ↗</a></p>';
      }

      if (name === "contact") {
        modalBody.innerHTML =
          '<h2 class="modal-title">Follow the project</h2>' +
          '<p class="modal-lede">Watch new episodes and follow the art behind Seafoam.</p>' +
          '<div class="contact-box"><p>Created by Lauren Leven · Aphros Animation</p>' +
          '<a class="contact-link" href="https://www.youtube.com/@AphrosAnimation" target="_blank" rel="noopener">YouTube ↗</a>' +
          '<a class="contact-link" href="https://www.instagram.com/aphrosanimation/" target="_blank" rel="noopener">Instagram ↗</a></div>';
      }

      if (name === "about") {
        modalBody.innerHTML =
          '<h2 class="modal-title">About Seafoam</h2>' +
          '<p class="modal-lede">An independent animated sci-fantasy series created by Lauren Leven.</p>' +
          '<p class="about-copy">Seafoam follows a cast of characters whose lives cross paths with F.A.T.E. Labs and a strange world shaped by the sea. Explore the episodes, get to know the cast, and follow the art as the series grows.</p>' +
          '<div class="fact-list"><span class="fact">Original animation</span><span class="fact">Sci-fantasy</span><span class="fact">Created by Lauren Leven</span></div>';
      }
    }

    function renderCharacter(index) {
      const character = characters[index];
      modalHeading.textContent = character.name;
      modalBody.innerHTML =
        '<button class="social-link" type="button" id="backToCharacters">← All characters</button>' +
        '<div class="character-detail">' +
        portraitMarkup(character).replace('class="portrait"', 'class="portrait character-portrait"') +
        '<div><h2 class="modal-title">' + character.name + '</h2><p class="about-copy">' + character.bio + '</p></div></div>' +
        ''; 
      modalBody.querySelector("#backToCharacters").addEventListener("click", function () { renderPanel("characters"); });
    }

    function chooseEpisode(number) {
      const episode = episodes.find(function (item) { return item.number === number; });
      if (!episode) return;
      if (!episode.videoId) {
        playerMessage.textContent = "This episode is listed; add its YouTube video ID in the episode list to play it.";
        playerMessage.hidden = false;
        playChime();
        return;
      }

      activeEpisode = episode.number;
      videoFrame.src = "https://www.youtube-nocookie.com/embed/" + episode.videoId + "?rel=0";
      videoFrame.title = "Seafoam Episode " + Number(episode.number) + " — " + episode.title;
      playerLabel.textContent = "Episode " + episode.number + " · " + episode.title;
      document.querySelector("#episodeEyebrow").textContent = "Episode " + episode.number + " · " + episode.title;
      document.querySelector("#episodeTitle").textContent = episode.title;
      document.querySelector("#episodeDescription").textContent = episode.description;
      playerMessage.hidden = true;
      modalBody.querySelectorAll("[data-episode]").forEach(function (button) {
        button.setAttribute("aria-current", String(button.dataset.episode === number));
      });
      playChime();
    }

    panelButtons.forEach(function (button) {
      button.addEventListener("click", function () { openPanel(button.dataset.panel); });
    });
    document.querySelector("#homeButton").addEventListener("click", function () {
      closePanel();
      playChime();
    });
    document.querySelector("#closeModal").addEventListener("click", closePanel);
    document.querySelector("#openPoster").addEventListener("click", openPoster);
    document.querySelector("#soundToggle").addEventListener("click", function (event) {
      soundEnabled = !soundEnabled;
      event.currentTarget.setAttribute("aria-pressed", String(soundEnabled));
      event.currentTarget.textContent = soundEnabled ? "Sound: on" : "Sound: off";
      playChime();
    });
    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape" && !modal.hidden) closePanel();
    });

    /* Drag the window by its title bar; on release it snaps to the nearest corner. */
    const modalHandle = document.querySelector("#modalHandle");
    modalHandle.addEventListener("pointerdown", function (event) {
      if (event.target.closest("button") || modal.hidden) return;
      const rect = modal.getBoundingClientRect();
      modal.style.left = rect.left + "px";
      modal.style.top = rect.top + "px";
      modal.style.bottom = "auto";
      modal.style.transform = "none";
      modalHandle.setPointerCapture(event.pointerId);
      const startX = event.clientX;
      const startY = event.clientY;
      const originX = rect.left;
      const originY = rect.top;
      function move(moveEvent) {
        const maxX = window.innerWidth - modal.offsetWidth - 10;
        const maxY = window.innerHeight - modal.offsetHeight - 10;
        const x = Math.max(10, Math.min(maxX, originX + moveEvent.clientX - startX));
        const y = Math.max(10, Math.min(maxY, originY + moveEvent.clientY - startY));
        modal.style.left = x + "px";
        modal.style.top = y + "px";
      }
      function finish() {
        modalHandle.removeEventListener("pointermove", move);
        modalHandle.removeEventListener("pointerup", finish);
        modalHandle.removeEventListener("pointercancel", finish);
      }
      modalHandle.addEventListener("pointermove", move);
      modalHandle.addEventListener("pointerup", finish);
      modalHandle.addEventListener("pointercancel", finish);
    });


    document.querySelector("#year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
